name: MLOps Redeploy (post-merge)

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger VPS redeploy
        env:
          HOOKD_USERNAME: ${{ secrets.HOOKD_USERNAME }}
          HOOKD_PASSWORD: ${{ secrets.HOOKD_PASSWORD }}
        run: |
          status=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST https://hookd.devangk.dev/post-merge \
            -u "$HOOKD_USERNAME:$HOOKD_PASSWORD" \
            -H 'Content-Type: application/json' \
            -d '{"action": "MLOps-Redeploy-All"}')
          cat response.json
          echo
          if [ "$status" != "202" ]; then
            echo "Redeploy request failed with HTTP $status"
            exit 1
          fi
